<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>button</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button class="button">
      <div class="logo">
        <div class="black-logo com-logo">
          <ion-icon name="flash"></ion-icon>
        </div>
        <div class="green-logo com-logo">
          <ion-icon name="flash"></ion-icon>
        </div>
      </div>

      <div class="text">
        <div class="black-text com-text"><p>Get All Access</p></div>
        <div class="white-text com-text"><p>Get All Access</p></div>
      </div>
    </button>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </body>
</html>
