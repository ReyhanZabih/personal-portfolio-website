<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hoverButton</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <button class="main-button">
        <div class="speak">
          <h3>Speak to me</h3>
          <p>Email or book a call</p>
        </div>

        <div class="button-items">
          <a href="">
            <div class="email item">
              <div class="logo">
                <ion-icon name="mail-sharp" style="color: white"></ion-icon>
              </div>
              <div class="logo-email">
                <ion-icon name="mail-open-sharp"></ion-icon>
              </div>
              <p>Contact</p>
            </div>
          </a>

          <a href="">
            <div class="call item">
              <div class="logo">
                <ion-icon name="calendar-clear-sharp"></ion-icon>
              </div>
              <div class="logo-call">
                <ion-icon name="calendar-number-sharp"></ion-icon>
              </div>
              <p>Book a call</p>
            </div>
          </a>
        </div>
      </button>
    </div>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </body>
</html>
